{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sp.name" . }}-sso
  labels:
    {{- include "sp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sp.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace | quote }} }
        - podSelector: {}
      ports:
        - { port: 4180, protocol: TCP }
        - { port: 15020, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 44180, protocol: TCP }
        - { port: 4180, protocol: TCP }
        - { port: 15020, protocol: TCP }
{{- end }}
{{- if and .Values.monitoring.podMonitor (.Capabilities.APIVersions.Has "azmonitoring.coreos.com/v1") }}
---
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "sp.name" . }}-sso
  labels:
    {{- include "sp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sp.selector" . | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}
