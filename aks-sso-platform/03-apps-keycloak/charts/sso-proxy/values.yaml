# One release per protected service. scripts/add-service.sh fills everything in; by hand:
#   helm upgrade --install project2-site charts/sso-proxy -n appsteam \
#     --set publicUrl=https://<fqdn> --set path=/project2/ --set upstream=http://project2-site.appsteam.svc.cluster.local:80 \
#     --set allowedGroups={project2} --set client.secret=… --set oauth2Proxy.cookieSecret=…

publicUrl: https://CHANGE-ME          # browser-facing base URL (02-istio-gateway output public_url)
path: /CHANGE-ME/                     # public path prefix for this service, with trailing slash
upstream: http://CHANGE-ME.appsteam.svc.cluster.local:80   # where authenticated requests go (full path is forwarded)
allowedGroups: []                     # Keycloak groups that may pass; [] = any signed-in user of the realm
displayName: ""                       # shown in Keycloak's client list; "" = release name

# ---- route through the Istio gateway -------------------------------------------------------------------------
gateway: istio-ingress/public-gateway
hosts: ["*"]

# ---- Keycloak (same namespace by default) ---------------------------------------------------------------------
keycloak:
  publicUrl: https://CHANGE-ME/auth
  internalUrl: http://keycloak.appsteam.svc.cluster.local:8080/auth
  realm: appsteam
  adminSecret: keycloak-admin
  image: quay.io/keycloak/keycloak:26.8.2

client:
  id: ""                              # "" = release name
  secret: CHANGE-ME                   # generated by add-service.sh
  registerJob: true

oauth2Proxy:
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
  replicas: 1
  cookieSecret: CHANGE-ME             # 32 random bytes, URL-safe base64 (add-service.sh generates it)
  cookieName: ""                      # "" = _sso_<release>
  cookieExpire: 8h
  cookieRefresh: 4m                   # refresh the session before Keycloak's 5-minute access token expires
  scope: "openid profile email"
  passUserHeaders: true               # X-Forwarded-User / -Email / -Preferred-Username / -Groups to the upstream
  passAccessToken: false              # X-Forwarded-Access-Token (JWT) to the upstream — only if the app verifies it
  skipAuthRoutes: []                  # regexes that bypass auth, e.g. ["^/project2/public/"]
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# ---- operations ------------------------------------------------------------------------------------------------
monitoring:
  podMonitor: true                    # oauth2-proxy metrics on :44180/metrics
networkPolicy:
  enabled: true
  gatewayNamespace: istio-ingress
