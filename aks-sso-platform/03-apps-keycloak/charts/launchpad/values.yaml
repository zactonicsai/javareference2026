# scripts/install.sh fills in publicUrl, image and secrets from the running Keycloak release. By hand:
#   helm upgrade --install launchpad charts/launchpad -n appsteam --set publicUrl=https://<fqdn> \
#     --set image.repository=<acr>.azurecr.io/launchpad --set client.secret=…

publicUrl: https://CHANGE-ME          # browser-facing base URL of the site (02-istio-gateway output public_url)

# ---- route through the Istio gateway -------------------------------------------------------------------------
gateway: istio-ingress/public-gateway
hosts: ["*"]
routes:
  exact: ["/", "/index", "/favicon.svg", "/robots.txt"]
  # Only these prefixes are routed to the launchpad (NOT a catch-all "/"), so other services can own /auth,
  # /project2/ … without route-ordering surprises across VirtualServices.
  prefixes: ["/restricted", "/projects", "/admin", "/go/", "/status", "/unavailable", "/login", "/logout", "/oauth2/", "/error", "/css/", "/js/", "/img/"]

# ---- image (built by scripts/build-image.sh with `az acr build`) --------------------------------------------
image:
  repository: CHANGE-ME.azurecr.io/launchpad
  tag: "1.0.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []                  # not needed on AKS with AcrPull on the kubelet identity (01-infra)

replicas: 1                           # >1 needs sticky sessions (DestinationRule consistentHash on LAUNCHPAD_SESSION) or Spring Session
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits:   { cpu: "1",  memory: 1Gi }
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
podDisruptionBudget:
  enabled: false

# ---- Keycloak (the keycloak chart in the same namespace; install.sh reads these from its release) --------------
keycloak:
  publicUrl: https://CHANGE-ME/auth   # browser-facing base incl. path
  internalUrl: http://keycloak.appsteam.svc.cluster.local:8080/auth
  realm: appsteam
  adminSecret: keycloak-admin         # Secret with username/password of the master-realm admin (same namespace)
  image: quay.io/keycloak/keycloak:26.8.2   # for kcadm in the client-register Job
  waitForKeycloak: true               # initContainer waits for realm discovery before the app starts

# ---- this app's OIDC client -----------------------------------------------------------------------------------
client:
  id: launchpad
  secret: CHANGE-ME                   # generated by install.sh; stored in Secret launchpad-client
  registerJob: true                   # post-install/upgrade Job creates/updates the client via kcadm; pre-delete Job removes it

# ---- application configuration (becomes /config/services.yaml → Spring `app.*`) -------------------------------
app:
  title: Apps Team Launchpad
  tagline: Single sign-on launch page for the team's services
  adminGroup: admin                   # Keycloak group with access to /admin and every project page
  statusInterval: 15s                 # how often services are health-checked
  projects:                           # /projects/<id>, visible to members of `group` (and admins)
    - id: project2
      name: Project 2
      group: project2
      description: Everything the project 2 team needs — links, tools and services tagged with group project2.
      owner: alice
      links:
        - { name: Project 2 example site, url: "{publicUrl}/project2/", description: Static site behind sso-proxy (examples/project2-site) }
    - id: project3
      name: Project 3
      group: project3
      description: Project 3 workspace — members of the project3 group only.
      owner: bob
      links: []
  services:                           # tiles on the launch page (groups empty = everyone)
    - id: keycloak-account
      name: My account
      description: Change your password, see your sessions and devices.
      url: "{publicUrl}/auth/realms/appsteam/account/"
      healthUrl: http://keycloak.appsteam.svc.cluster.local:8080/auth/realms/appsteam/.well-known/openid-configuration
      icon: key
      order: 10
    - id: keycloak-admin
      name: Keycloak admin console
      description: Users, groups, clients and sessions of the appsteam realm.
      url: "{publicUrl}/auth/admin/appsteam/console/"
      healthUrl: http://keycloak.appsteam.svc.cluster.local:9000/auth/health/ready
      groups: [admin]
      icon: shield
      order: 20
    - id: launchpad-restricted
      name: Restricted page
      description: Any signed-in user can open this — the simplest SSO check.
      url: "{publicUrl}/restricted"
      healthUrl: ""
      icon: lock
      order: 30
  extraServices: []                   # scripts/add-service.sh appends here (JSON files in services.d/)

# ---- operations ------------------------------------------------------------------------------------------------
monitoring:
  podMonitor: true                    # /actuator/prometheus on the management port (8081)
networkPolicy:
  enabled: true
  gatewayNamespace: istio-ingress
logging:
  structured: ecs                     # JSON lines (Elastic Common Schema) for Container Insights; "" = plain text
extraEnv: []                          # e.g. [{ name: LOGGING_LEVEL_COM_APPSTEAM_LAUNCHPAD, value: debug }]
