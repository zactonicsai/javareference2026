{{- $r := .Values.realm }}
{{- $https := eq (include "kc.https" .) "true" }}
# Realm import file (Keycloak reads /opt/keycloak/data/import/*.json on start). Imported once; later changes in
# the admin console win. Set realm.reimportOnUpgrade=true to force-overwrite on every start (demo only).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-realm
  labels:
    {{- include "kc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $r.name }}-realm.json: |
    {
      "realm": {{ $r.name | quote }},
      "displayName": {{ $r.displayName | quote }},
      "displayNameHtml": "<b>{{ $r.displayName }}</b>",
      "enabled": true,
      "sslRequired": {{ ternary "external" "none" $https | quote }},
      "registrationAllowed": false,
      "resetPasswordAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "bruteForceProtected": {{ $r.bruteForceProtected }},
      "failureFactor": 10,
      "ssoSessionIdleTimeout": {{ mul $r.ssoSessionIdleMinutes 60 }},
      "ssoSessionMaxLifespan": {{ mul $r.ssoSessionMaxHours 3600 }},
      "accessTokenLifespan": 300,
      {{- if $r.passwordPolicy }}
      "passwordPolicy": {{ $r.passwordPolicy | quote }},
      {{- end }}
      "eventsEnabled": true,
      "eventsExpiration": 604800,
      "adminEventsEnabled": true,
      "adminEventsDetailsEnabled": true,
      "roles": { "realm": [
        {{- range $i, $role := $r.roles }}{{ if $i }},{{ end }}
        { "name": {{ $role.name | quote }}, "description": {{ default "" $role.description | quote }} }
        {{- end }}
      ] },
      "groups": [
        {{- range $i, $g := $r.groups }}{{ if $i }},{{ end }}
        { "name": {{ $g.name | quote }}, "path": "/{{ $g.name }}",
          "realmRoles": [ {{- range $j, $role := $g.roles }}{{ if $j }}, {{ end }}{{ $role | quote }}{{ end }} ] }
        {{- end }}
      ],
      "users": [
        {{- range $i, $u := $r.users }}{{ if $i }},{{ end }}
        {
          "username": {{ $u.username | quote }},
          "enabled": true,
          "email": {{ default (printf "%s@%s.local" $u.username $r.name) $u.email | quote }},
          "emailVerified": true,
          "firstName": {{ default "" $u.firstName | quote }},
          "lastName": {{ default "" $u.lastName | quote }},
          "credentials": [ { "type": "password", "value": {{ $u.password | quote }}, "temporary": false } ],
          "realmRoles": [ "default-roles-{{ $r.name }}" ],
          "groups": [ {{- range $j, $g := $u.groups }}{{ if $j }}, {{ end }}"/{{ $g }}"{{ end }} ]
        }
        {{- end }}
      ],
      "clientScopes": [
        {
          "name": "groups",
          "description": "Group membership as a flat `groups` claim",
          "protocol": "openid-connect",
          "attributes": { "include.in.token.scope": "true", "display.on.consent.screen": "false" },
          "protocolMappers": [
            { "name": "groups", "protocol": "openid-connect", "protocolMapper": "oidc-group-membership-mapper", "consentRequired": false,
              "config": { "claim.name": "groups", "full.path": "false", "id.token.claim": "true", "access.token.claim": "true", "userinfo.token.claim": "true" } }
          ]
        }
      ],
      "defaultDefaultClientScopes": [ "profile", "email", "roles", "web-origins", "groups", "basic", "acr" ]
    }
