{{- $pg := .Values.postgres }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-postgres
  labels:
    {{- include "kc.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ $pg.username | quote }}
  password: {{ $pg.password | quote }}
  database: {{ $pg.database | quote }}
  jdbcUrl: {{ include "kc.jdbc" . | quote }}
{{- if $pg.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  labels:
    app: keycloak-postgres
    {{- include "kc.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: { app: keycloak-postgres }
  ports:
    - { name: tcp-postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgres
  labels:
    app: keycloak-postgres
    {{- include "kc.labels" . | nindent 4 }}
spec:
  serviceName: keycloak-postgres
  replicas: 1
  selector:
    matchLabels: { app: keycloak-postgres }
  template:
    metadata:
      labels: { app: keycloak-postgres, app.kubernetes.io/part-of: aks-sso-platform }
      annotations:
        sidecar.istio.io/inject: "false"      # plain TCP; keep the database out of the mesh
    spec:
      securityContext: { fsGroup: 70, runAsUser: 70, runAsGroup: 70, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ $pg.image | quote }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: keycloak-postgres, key: database } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: keycloak-postgres, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-postgres, key: password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{ name: tcp-postgres, containerPort: 5432 }]
          startupProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 20
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: tmp, mountPath: /var/run/postgresql }
      volumes:
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $pg.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.storage }}
{{- end }}
