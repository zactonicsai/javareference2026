# scripts/install.sh fills in publicUrl and the generated passwords. By hand:
#   helm upgrade --install keycloak charts/keycloak -n appsteam --create-namespace \
#     --set publicUrl=https://<fqdn> --set admin.password=… --set postgres.password=…

publicUrl: https://CHANGE-ME        # what browsers use (02-istio-gateway output public_url), no trailing slash
relativePath: /auth                 # Keycloak lives at <publicUrl>/auth

# ---- route through the Istio gateway -------------------------------------------------------------------------
gateway: istio-ingress/public-gateway
hosts: ["*"]                        # or [<fqdn>]

# ---- Keycloak -------------------------------------------------------------------------------------------------
image: quay.io/keycloak/keycloak:26.8.2
replicas: 1                         # >1 needs KC_CACHE_STACK=kubernetes + a headless service; single node is fine for a team
admin:
  username: admin
  password: CHANGE-ME               # bootstrap admin of the *master* realm; stored in Secret keycloak-admin
logLevel: info
resources:
  requests: { cpu: 250m, memory: 768Mi }
  limits:   { cpu: "1",  memory: 1536Mi }
extraArgs: []                       # e.g. ["--features=token-exchange"]
extraEnv: []                        # e.g. [{ name: KC_LOG_CONSOLE_OUTPUT, value: json }]

# ---- PostgreSQL (in-cluster StatefulSet; or point externalUrl at Azure Database for PostgreSQL) ---------------
postgres:
  enabled: true
  image: postgres:17-alpine
  database: keycloak
  username: keycloak
  password: CHANGE-ME               # stored in Secret keycloak-postgres
  storage: 8Gi
  storageClass: ""                  # "" = cluster default (AKS: managed-csi)
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  externalUrl: ""                   # jdbc:postgresql://host:5432/keycloak (when enabled=false); username/password above still apply

# ---- realm (imported on FIRST start; afterwards the database is the truth — manage users in the admin console) ----
realm:
  name: appsteam
  displayName: Apps Team
  reimportOnUpgrade: false          # true = OVERWRITE_EXISTING on every restart (demo only; loses console changes)
  bruteForceProtected: true
  passwordPolicy: ""                # e.g. "length(12) and digits(1)" — empty for simple demo passwords
  ssoSessionIdleMinutes: 30
  ssoSessionMaxHours: 10
  # roles are realm roles; groups carry the same names and map to them — apps may check either `groups` or `roles`
  roles:
    - { name: admin,    description: "Platform administrators: every page, Keycloak console" }
    - { name: project2, description: "Members of project 2" }
    - { name: project3, description: "Members of project 3" }
  groups:
    - { name: admin,    roles: [admin] }
    - { name: project2, roles: [project2] }
    - { name: project3, roles: [project3] }
  # default users — SIMPLE passwords for a demo; override with --set or a values file for anything real
  users:
    - { username: admin,  password: admin123,  email: admin@appsteam.local,  firstName: Ada,    lastName: Admin,   groups: [admin] }
    - { username: alice,  password: alice123,  email: alice@appsteam.local,  firstName: Alice,  lastName: Anders,  groups: [project2] }
    - { username: bob,    password: bob123,    email: bob@appsteam.local,    firstName: Bob,    lastName: Builder, groups: [project3] }
    - { username: carol,  password: carol123,  email: carol@appsteam.local,  firstName: Carol,  lastName: Cross,   groups: [project2, project3] }
    - { username: viewer, password: viewer123, email: viewer@appsteam.local, firstName: Vic,    lastName: Viewer,  groups: [] }
  # Application clients are NOT defined here: every app registers its own (launchpad / sso-proxy hook Jobs).

# ---- operations ------------------------------------------------------------------------------------------------
monitoring:
  podMonitor: true                  # Managed Prometheus scrape of /auth/metrics on the management port
networkPolicy:
  enabled: true                     # only the gateway namespace + this namespace may reach Keycloak; only Keycloak may reach Postgres
  gatewayNamespace: istio-ingress
podDisruptionBudget:
  enabled: false                    # single replica: a PDB would block node drains
