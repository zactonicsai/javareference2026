# Java toolchain used to compile/run (Gradle downloads it if missing when foojay resolver is enabled; the
# Dockerfile uses eclipse-temurin:25-jdk so nothing is downloaded in CI).
javaVersion=25
springBootVersion=4.1.3
org.gradle.jvmargs=-Xmx1g
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
