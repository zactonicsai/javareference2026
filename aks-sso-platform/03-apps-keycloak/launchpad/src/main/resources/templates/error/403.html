<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Access denied')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<header th:replace="~{layout :: header}"></header>
<main class="mx-auto max-w-2xl px-4 sm:px-6 py-16">
  <div class="rounded-3xl border border-rose-200 bg-white p-8 shadow-sm">
    <div class="flex items-start gap-4">
      <span class="inline-flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-rose-100 text-rose-700"><svg class="h-6 w-6"><use href="#icon-lock"/></svg></span>
      <div>
        <p class="text-xs font-semibold uppercase tracking-widest text-rose-600">403 · access denied</p>
        <h1 class="mt-1 text-2xl font-bold tracking-tight text-slate-900">You are signed in, but this needs another group</h1>
        <p class="mt-2 text-slate-600" th:text="${message != null} ? ${message} : 'Your account does not have access to this page.'">reason</p>
        <p class="mt-2 text-sm text-slate-600" th:if="${requiredGroups != null and !requiredGroups.isEmpty()}">
          Required: <span th:each="g, it : ${requiredGroups}"><code th:text="${g}">g</code><span th:unless="${it.last}"> or </span></span>
          — you have: <span th:text="${user.groupList().isEmpty()} ? 'no groups' : ${#strings.listJoin(user.groupList(), ', ')}">none</span>.
        </p>
        <p class="mt-2 text-sm text-slate-500">Ask a platform admin to add you to the group in Keycloak, then sign out and in again.</p>
      </div>
    </div>
    <div class="mt-6 flex flex-wrap gap-3">
      <a href="/" class="btn-primary">← Back to services</a>
      <form th:if="${user.isAuthenticated()}" th:action="@{/logout}" method="post" class="inline"><button class="btn-secondary" type="submit">Switch account</button></form>
      <a th:unless="${user.isAuthenticated()}" href="/oauth2/authorization/keycloak" class="btn-secondary">Sign in</a>
    </div>
  </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
