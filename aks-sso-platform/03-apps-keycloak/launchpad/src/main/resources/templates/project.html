<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${project.name()})}"></head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<header th:replace="~{layout :: header}"></header>
<main class="mx-auto max-w-5xl px-4 sm:px-6 py-12">
  <nav class="text-xs text-slate-500"><a href="/" class="hover:underline">Services</a> / <span>Projects</span> / <span class="text-slate-700" th:text="${project.name()}">P</span></nav>
  <div class="mt-3 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
    <div>
      <p class="text-xs font-semibold uppercase tracking-widest text-violet-600">Project page · group <code th:text="${project.group()}">g</code></p>
      <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900" th:text="${project.name()}">Project</h1>
      <p class="mt-3 max-w-2xl text-slate-600" th:text="${project.description()}">description</p>
      <p th:if="${!project.owner().isEmpty()}" class="mt-1 text-sm text-slate-500">Owner: <span th:text="${project.owner()}">owner</span></p>
    </div>
    <span class="inline-flex items-center gap-2 rounded-full bg-emerald-50 border border-emerald-200 px-3 py-1.5 text-sm text-emerald-700">
      <svg class="h-4 w-4"><use href="#icon-shield"/></svg> access granted
      <span th:if="${user.isAdmin() and !user.inGroup(project.group())}" class="text-xs">(admin)</span>
    </span>
  </div>

  <section class="mt-10" th:if="${!project.links().isEmpty()}">
    <h2 class="section-title">Links</h2>
    <ul class="mt-4 grid gap-3 sm:grid-cols-2">
      <li th:each="l : ${project.links()}" class="card">
        <a class="font-semibold text-indigo-700 hover:underline" th:href="${l.url()}" th:text="${l.name()}" target="_blank" rel="noopener">link</a>
        <p class="mt-1 text-sm text-slate-600" th:text="${l.description()}">d</p>
      </li>
    </ul>
  </section>

  <section class="mt-10">
    <h2 class="section-title">Services for this project</h2>
    <p th:if="${tiles.isEmpty()}" class="mt-2 text-sm text-slate-500">
      No service is tagged with group <code th:text="${project.group()}">g</code> yet.
      Add one with <code>scripts/add-service.sh … --group <span th:text="${project.group()}">g</span></code>.
    </p>
    <div class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <div th:each="t : ${tiles}" class="card flex flex-col">
        <div class="flex items-start justify-between gap-3">
          <p class="font-semibold text-slate-900" th:text="${t.service().name()}">svc</p>
          <th:block th:if="${t.service().isChecked()}"><span th:replace="~{layout :: badge(${t.status()})}"></span></th:block>
        </div>
        <p class="mt-2 text-sm text-slate-600 flex-1" th:text="${t.service().description()}">d</p>
        <a th:href="@{/go/{id}(id=${t.id()})}" class="btn-primary mt-4 self-start">Open <svg class="ml-1 h-4 w-4"><use href="#icon-arrow"/></svg></a>
      </div>
    </div>
  </section>

  <div class="mt-10"><a href="/" class="btn-secondary">← Back to services</a></div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<script src="/js/status.js" th:attr="data-interval=${app.status().interval().toMillis()}"></script>
</body>
</html>
