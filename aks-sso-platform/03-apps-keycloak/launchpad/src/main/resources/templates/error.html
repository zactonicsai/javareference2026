<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Error')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<header th:replace="~{layout :: header}"></header>
<main class="mx-auto max-w-2xl px-4 sm:px-6 py-16 text-center">
  <p class="text-xs font-semibold uppercase tracking-widest text-slate-500" th:text="${status}">error</p>
  <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900" th:text="${error != null} ? ${error} : 'Error'">Error</h1>
  <p class="mt-3 text-slate-600" th:text="${message != null and message != ''} ? ${message} : 'The request could not be completed.'">msg</p>
  <a href="/" class="btn-primary mt-8">← Back to services</a>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
