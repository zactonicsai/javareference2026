{{- if and .Values.monitoring.podMonitors (.Capabilities.APIVersions.Has "azmonitoring.coreos.com/v1") }}
# Azure Managed Prometheus (AKS add-on) ships PodMonitor/ServiceMonitor CRDs compatible with prometheus-operator.
# 1) istiod control-plane metrics
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istiod
  namespace: {{ .Values.monitoring.istioNamespace }}
  labels:
    {{- include "gc.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: istiod
  podMetricsEndpoints:
    - port: http-monitoring
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
---
# 2) Envoy metrics of the gateway and every sidecar (merged on port 15020 by the prometheus.io/* annotations)
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-stats
  namespace: {{ .Values.monitoring.istioNamespace }}
  labels:
    {{- include "gc.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: istio-prometheus-ignore
        operator: DoesNotExist
  podMetricsEndpoints:
    - path: /stats/prometheus
      interval: {{ .Values.monitoring.interval }}
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_container_name]
          regex: "istio-proxy"
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_annotationpresent_prometheus_io_scrape]
        - action: replace
          regex: (\d+);((([0-9]+?)(\.|$)){4})
          replacement: $2:$1
          sourceLabels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
          targetLabel: __address__
        - action: labeldrop
          regex: "__meta_kubernetes_pod_label_(.+)"
        - sourceLabels: [__meta_kubernetes_namespace]
          action: replace
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          action: replace
          targetLabel: pod_name
{{- end }}
