apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.sshServiceName }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.serviceType }}
  selector:
    app: {{ .Values.sshPodName }}
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
      {{- if eq .Values.serviceType "NodePort" }}
      nodePort: {{ .Values.sshNodePort }}
      {{- end }}
