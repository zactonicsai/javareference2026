{{- if .Values.istio.enabled }}
{{- $vs := .Values.istio.virtualService }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-virtualservice
  labels:
    app: secure-groups
spec:
  hosts:
    {{- toYaml $vs.hosts | nindent 4 }}
  gateways:
    {{- toYaml $vs.gateways | nindent 4 }}
  http:
    - route:
        - destination:
            host: {{ .Release.Name }}-service.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      {{- if $vs.pathPrefix }}
      match:
        - uri:
            prefix: {{ $vs.pathPrefix | quote }}
      {{- if $vs.rewriteToRoot }}
      rewrite:
        uri: /
      {{- end }}
      {{- end }}
      {{- if $vs.timeout }}
      timeout: {{ $vs.timeout }}
      {{- end }}
      {{- if $vs.retries }}
      retries:
        {{- toYaml $vs.retries | nindent 8 }}
      {{- end }}
{{- end }}
