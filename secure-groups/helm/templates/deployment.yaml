apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: secure-groups
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: secure-groups
  template:
    metadata:
      labels:
        app: secure-groups
    spec:
      containers:
        - name: secure-groups
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.springProfilesActive | quote }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"