apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if .Values.ssh.enabled }}
      annotations:
        # Restart the pod when the authorized keys change.
        checksum/ssh-keys: {{ .Values.ssh.authorizedKeys | sha256sum | quote }}
      {{- end }}
    spec:
      containers:
        - name: linux
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["sh", "/opt/linux/start.sh"]
          ports:
            - containerPort: {{ .Values.service.port }}
            {{- if .Values.ssh.enabled }}
            - containerPort: {{ .Values.ssh.port }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /opt/linux
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
