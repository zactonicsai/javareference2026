apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    workspace-group: {{ .Values.group | quote }}
    workspace-image: {{ .Values.imageId | quote }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    # Port names carry the protocol prefix Istio uses for routing (http-, tcp-).
    - name: http-app
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
    {{- if .Values.ssh.enabled }}
    - name: tcp-ssh
      port: {{ .Values.ssh.port }}
      targetPort: {{ .Values.ssh.port }}
    {{- end }}
