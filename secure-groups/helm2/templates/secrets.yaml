apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: secure-groups
type: Opaque
stringData:
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  USER_PASSWORD: {{ .Values.secrets.userPassword | quote }}
  USER2_PASSWORD: {{ .Values.secrets.user2Password | quote }}