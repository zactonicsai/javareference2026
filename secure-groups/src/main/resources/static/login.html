<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/app.css"><title>Sign in · Team workspace</title><script src="/assets/login.js" defer></script></head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex items-center justify-center p-6">
<main class="bg-white border border-slate-200 rounded-2xl p-8 w-full max-w-md shadow-sm">
<p class="text-blue-700 font-semibold text-sm uppercase tracking-widest">Team workspace</p><h1 class="text-3xl font-bold mt-3 mb-3">Welcome back</h1>
<p class="text-slate-600 mb-6">Sign in to open your team's workspace.</p>
<p id="status" role="status" class="text-sm text-blue-800 mb-4"></p>
<form method="post" action="/login" class="space-y-5">
<input id="csrf" type="hidden" name="_csrf">
<div><label for="username" class="block font-medium mb-2">Username</label><input id="username" name="username" autocomplete="username" required maxlength="100" class="w-full border border-slate-400 rounded-lg p-3"></div>
<div><label for="password" class="block font-medium mb-2">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required class="w-full border border-slate-400 rounded-lg p-3"></div>
<button id="submit" disabled class="w-full rounded-lg bg-blue-700 text-white p-3 font-semibold disabled:opacity-50">Sign in</button></form>
<p class="text-sm text-slate-500 mt-6">Your session ends after 15 minutes of inactivity.</p></main></body></html>
