# =============================================================================
# acme-local / login  -- LOCAL OVERRIDE theme (plain folder, mounted by compose)
# =============================================================================
# This theme lives outside the jar, in ./themes, and is bind-mounted to
# /opt/keycloak/themes. Its parent is the theme packaged in the provider jar.
#
#     acme-local  (this folder)      <- only what differs locally
#        |  parent
#     acme-base   (provider jar)     <- custom step template + company branding
#        |  parent
#     keycloak.v2 (Keycloak)         <- all standard screens
#        |  parent
#     base        (Keycloak)
#
# HOW OVERRIDING WORKS
#   Keycloak resolves every file by name, starting at the realm's theme and
#   walking up the parents. A file placed here shadows the same file in every
#   parent; files you do not place here are inherited untouched.
#
#   templates   login/<name>.ftl           whole file replaces the parent's
#   messages    login/messages/*.properties  merged per KEY (only list changes)
#   properties  login/theme.properties     merged per KEY (only list changes)
#   static      login/resources/**         per file; reference via ${url.resourcesPath}
#
# WHAT THIS THEME OVERRIDES
#   login.ftl                      the username/password screen (ONE screen only)
#   messages/messages_en.properties  a few texts
#   resources/css/local.css        extra stylesheet
# Every other screen -- including the provider's email-otp.ftl -- is inherited.
#
# TO OVERRIDE ANOTHER SCREEN
#   1. Find the template name: view the page source, every screen starts with
#      an HTML comment like  <!-- template: login-reset-password.ftl -->
#   2. Copy the ORIGINAL of that file from the exact Keycloak version you run
#      (see README.md, "Getting the original template") into this folder.
#   3. Change only what you need and mark your changes with comments.
#   4. Reload the browser. In dev mode (start-dev) themes are not cached.
#   After each Keycloak upgrade, diff your copies against the new originals.
# -----------------------------------------------------------------------------

parent=acme-base
import=common/keycloak

# "styles" replaces the parent's value, so list the inherited files first and
# append the local one last (it wins on equal specificity).
styles=css/styles.css css/acme.css css/local.css

# Overrides a custom property defined in acme-base (merged per key).
acmeSupportEmail=helpdesk@local.acme.test

# Custom property used by our login.ftl override. Remove or empty to hide the banner.
acmeEnvironmentLabel=XXXXXX
loginAccountTitle=Sign in to akakaka (local)
