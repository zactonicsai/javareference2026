# =============================================================================
# acme-base / login  -- the theme that ships INSIDE the provider jar
# =============================================================================
# Role: the company-wide baseline. It carries
#   * the template for our custom authenticator step (email-otp.ftl), and
#   * shared branding (css/acme.css) and texts (messages/).
# It is versioned and released together with the Java code, because the
# authenticator and its template must always match.
#
# Environment- or project-specific tweaks do NOT belong here. Put them in a
# child theme (see themes/acme-local) that declares "parent=acme-base".
#
# Template lookup order when the realm uses acme-local:
#   acme-local (folder)  ->  acme-base (this jar)  ->  keycloak.v2  ->  base
# The first theme that contains the requested file wins.
# -----------------------------------------------------------------------------

# Everything we do not define ourselves is inherited from Keycloak's default
# login theme. Pinning to keycloak.v2 keeps the PatternFly 5 markup/macros.
parent=keycloak.v2

# Re-use Keycloak's shared static resources (PatternFly, icons, fonts).
import=common/keycloak

# IMPORTANT: "styles" is REPLACED, not appended, when a child sets it.
# So we repeat the parent's stylesheet and then add ours (later files win).
styles=css/styles.css css/acme.css

# Custom properties are readable in templates as ${properties.<name>}.
# A child theme can override them just by redefining the key.
acmeSupportEmail=support@acme.test

acmeEnvironmentLabel=zzzzk
loginAccountTitle=Sign in to Provdddider (local)
