# acme-base / email -- templates for mails sent by the provider.
# Set the realm's "Email theme" to acme-base (or to a child theme of it),
# otherwise EmailOtpAuthenticator cannot find email-otp.ftl.
#
# All standard Keycloak mails (password reset, verify e-mail, ...) are
# inherited unchanged from "base".
#
# HOW TO OVERRIDE the OTP mail locally: create themes/<name>/email/ with
# "parent=acme-base" and add html/email-otp.ftl and/or text/email-otp.ftl,
# or just redefine the message keys in messages/messages_en.properties.
parent=base
